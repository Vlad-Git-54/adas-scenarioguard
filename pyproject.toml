[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adas-scenarioguard"
version = "0.1.0"
description = "MVP for critical scenario detection in multimodal ADAS perception"
authors = [{ name = "Vladislav Marianovskiy" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
